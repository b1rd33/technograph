name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.7"
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Offline benchmarks
        run: go test -run '^$' -bench . -benchtime=100x ./internal/fingerprint ./internal/extract
      - name: Race detector
        run: go test -race ./...
      - name: Build
        run: go build -trimpath ./cmd/technograph ./cmd/technograph-mcp
